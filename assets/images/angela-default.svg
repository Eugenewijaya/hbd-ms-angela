<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5EC" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#E0F4FF" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06D6A0" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B2D42" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  <circle cx="400" cy="300" r="320" fill="url(#sunGlow)"/>

  <!-- Playful Decorative Floating Elements in Background -->
  <g opacity="0.45">
    <circle cx="140" cy="160" r="45" fill="#FFD166"/>
    <circle cx="680" cy="200" r="55" fill="#4EA8DE"/>
    <circle cx="120" cy="620" r="70" fill="#06D6A0"/>
    <circle cx="700" cy="580" r="60" fill="#9B5DE5"/>
    <path d="M 620,120 L 635,160 L 675,165 L 645,190 L 655,230 L 620,205 L 585,230 L 595,190 L 565,165 L 605,160 Z" fill="#FFD166" opacity="0.7"/>
    <path d="M 180,480 L 190,510 L 220,515 L 195,535 L 205,565 L 180,545 L 155,565 L 165,535 L 140,515 L 170,510 Z" fill="#FF6B8B" opacity="0.6"/>
  </g>

  <!-- Character Group: Ms. Angela -->
  <g transform="translate(400, 420)" filter="url(#softShadow)">
    <!-- Shoulders & Outfit -->
    <path d="M -190,290 C -190,140 190,140 190,290 Z" fill="url(#shirtGrad)"/>
    <path d="M -70,150 L 0,225 L 70,150 Z" fill="#FFFFFF"/>
    <!-- Speech Therapist Lanyard / ID Badge -->
    <path d="M -25,225 L -15,310 L 15,310 L 25,225 Z" fill="#4EA8DE"/>
    <rect x="-35" y="300" width="70" height="48" rx="8" fill="#FFFFFF" stroke="#4EA8DE" stroke-width="3"/>
    <rect x="-25" y="312" width="50" height="6" rx="3" fill="url(#badgeGrad)"/>
    <circle cx="0" cy="330" r="5" fill="#FFD166"/>

    <!-- Hair Back -->
    <path d="M -130,-50 C -150,-180 150,-180 130,-50 C 150,60 120,160 90,175 C 0,130 0,130 -90,175 C -120,160 -150,60 -130,-50 Z" fill="#2B2D42"/>

    <!-- Neck -->
    <rect x="-36" y="90" width="72" height="65" rx="10" fill="#FFDFC4"/>

    <!-- Face Base -->
    <circle cx="0" cy="-20" r="105" fill="#FFDFC4"/>

    <!-- Ears & Cute Star Earrings -->
    <circle cx="-105" cy="-20" r="18" fill="#FFDFC4"/>
    <circle cx="105" cy="-20" r="18" fill="#FFDFC4"/>
    <path d="M -105,-5 L -101,-15 L -91,-16 L -99,-22 L -96,-32 L -105,-26 L -114,-32 L -111,-22 L -119,-16 L -109,-15 Z" fill="#FFD166"/>
    <path d="M 105,-5 L 109,-15 L 119,-16 L 111,-22 L 114,-32 L 105,-26 L 96,-32 L 99,-22 L 91,-16 L 101,-15 Z" fill="#FFD166"/>

    <!-- Hair Front Bangs -->
    <path d="M -105,-35 C -65,-125 65,-125 105,-35 C 80,-95 -80,-95 -105,-35 Z" fill="#2B2D42"/>
    <path d="M -105,-35 C -75,-60 -30,-40 -10,-85 C -45,-50 -75,-30 -105,-35 Z" fill="#2B2D42"/>
    <path d="M 105,-35 C 75,-60 30,-40 10,-85 C 45,-50 75,-30 105,-35 Z" fill="#2B2D42"/>

    <!-- Gentle Eyebrows -->
    <path d="M -65,-60 Q -40,-75 -15,-60" fill="none" stroke="#2B2D42" stroke-width="6" stroke-linecap="round"/>
    <path d="M 15,-60 Q 40,-75 65,-60" fill="none" stroke="#2B2D42" stroke-width="6" stroke-linecap="round"/>

    <!-- Warm Smiling Eyes -->
    <circle cx="-40" cy="-28" r="12" fill="#2B2D42"/>
    <circle cx="40" cy="-28" r="12" fill="#2B2D42"/>
    <!-- Eye Highlights -->
    <circle cx="-44" cy="-32" r="4.5" fill="#FFFFFF"/>
    <circle cx="36" cy="-32" r="4.5" fill="#FFFFFF"/>
    <circle cx="-36" cy="-24" r="2" fill="#FFFFFF"/>
    <circle cx="44" cy="-24" r="2" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="-60" cy="0" rx="18" ry="11" fill="#FF6B8B" opacity="0.45"/>
    <ellipse cx="60" cy="0" rx="18" ry="11" fill="#FF6B8B" opacity="0.45"/>

    <!-- Cute Nose -->
    <path d="M 0,-15 Q 6,6 -4,10" fill="none" stroke="#E09F67" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Loving Warm Smile -->
    <path d="M -32,24 Q 0,55 32,24" fill="#C9184A" stroke="#A4133C" stroke-width="4" stroke-linecap="round"/>
    <path d="M -22,25 Q 0,42 22,25 Z" fill="#FFFFFF"/>

    <!-- Birthday Star Headband / Crown -->
    <path d="M -75,-115 Q 0,-140 75,-115" fill="none" stroke="#FFD166" stroke-width="10" stroke-linecap="round"/>
    <!-- Star on Crown -->
    <g transform="translate(0, -145) scale(1.1)">
      <polygon points="0,-35 11,-12 36,-10 17,9 23,34 0,20 -23,34 -17,9 -36,-10 -11,-12" fill="#FFD166" stroke="#F4A261" stroke-width="4" filter="url(#softShadow)"/>
      <circle cx="0" cy="0" r="7" fill="#FFFDF7"/>
    </g>
  </g>

  <!-- Top Title Banner Badge -->
  <g transform="translate(400, 75)" filter="url(#softShadow)">
    <rect x="-170" y="-32" width="340" height="64" rx="32" fill="#FFFFFF" stroke="#06D6A0" stroke-width="4"/>
    <text x="0" y="9" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#06D6A0" text-anchor="middle">
      🌟 STAR CHAMPS THERAPY
    </text>
  </g>
</svg>
